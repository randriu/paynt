[build-system]
requires = ["scikit-build-core==1.1.0", "pybind11==3.1.0", "stormpy>=1.14.0"]
build-backend = "scikit_build_core.build"

[project]
name = "paynt"
description = "PAYNT - Probabilistic progrAm sYNThesizer"
readme = "README.md"
license.file = "LICENSE"
dynamic = ["version"]
authors = [
    { name = "R. Andriushchenko", email = "iandri@fit.vut.cz" },
    { name = "F. Macák", email = "imacak@fit.vut.cz" },
]
requires-python = ">=3.10"
dependencies = [
    "stormpy>=1.14.0",
    "z3-solver>=5.0.0.0",
    "click>=8.1.3",
    "rich-click>=1.9",
    "psutil>=7.0.0",
    "graphviz>=0.20.1",
    "scikit-learn>=1.8.0",
]
classifiers = [
    'Intended Audience :: Science/Research',
    'Topic :: Scientific/Engineering',
    'Topic :: Software Development :: Libraries :: Python Modules',
]
keywords = [
    "stormpy", 
    "synthesis", 
    "paynt", 
    "storm",
]

[project.urls]
Homepage = "https://github.com/randriu/paynt"
"Bug Tracker" = "https://github.com/randriu/paynt/issues"

[project.optional-dependencies]
numpy = [
    "numpy"
]
plot = [
    "matplotlib",
    "numpy",
    "scipy",
]
dev = [
    # Formatting + linting
    "ruff",
    # Docstring formatting
    "docformatter",
    # Type checking
    "mypy",
]
test = [
    "pytest",
    "nbval",
    "numpy",
]

[tool.scikit-build]
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
cmake.args = []
wheel.packages = ["paynt", "payntbind/lib/payntbind"]
sdist.include = [
    "payntbind/lib/payntbind/info/_config.py",
]

[tool.scikit-build.cmake.define]
STORM_DIR_HINT=""
PAYNT_ALLOW_STORM_SYSTEM="ON"
PAYNT_ALLOW_STORM_FETCH="ON"
STORM_GIT_REPO="https://github.com/moves-rwth/storm.git"
STORM_GIT_TAG="master"

[[tool.dynamic-metadata]]
provider = "scikit_build_core.metadata.regex"
field = "version"
input = "paynt/_version.py"

[tool.cibuildwheel]
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"
skip = "*musllinux*"

[tool.cibuildwheel.linux]
before-all = ".github/workflows/before-all-linux.sh"
repair-wheel-command = "auditwheel show --disable-isa-ext-check {wheel} && auditwheel repair --disable-isa-ext-check -w {dest_dir} {wheel}"

[tool.cibuildwheel.macos]
before-all = ".github/workflows/before-all-macos.sh"
repair-wheel-command = "delocate-listdeps -vv --depending --all {wheel} && DYLD_LIBRARY_PATH=$REPAIR_LIBRARY_PATH delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v {wheel}"

[tool.cibuildwheel.config-settings]
"cmake.args" = ["-DSTORM_PORTABLE=ON", "-DPAYNT_ALLOW_STORM_SYSTEM=ON", "-DPAYNT_ALLOW_STORM_FETCH=OFF", "-DPAYNT_INFO_PRETEND_FETCH=ON"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "C4", "UP", "PIE", "RET"]

[tool.ruff.lint.per-file-ignores]
# __init__.py files across paynt/ are pure re-export surfaces (`from .foo import Bar`, some via `from .api
# import *`) -- the imports are the point, not dead code.
"__init__.py" = ["F401", "F403"]

[tool.docformatter]
wrap-summaries = 160
wrap-descriptions = 160

[project.scripts]
paynt = "paynt.cli:main"

[tool.mypy]
python_version = "3.10"
check_untyped_defs = false
disallow_untyped_defs = false
warn_unused_ignores = true
ignore_missing_imports = true
exclude = ["build/", "payntbind/"]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test*.py"]
python_functions = ["*_test", "test_*"]
