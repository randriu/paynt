# Benchmarks of tests/performance/run.py. project is a folder of models/performance-test, args are passed to paynt
# (or to build.py when build = true), expected is the result paynt must report. deterministic = false marks the cases
# whose search depends on timing (Hybrid, dtnest): their iterations and result vary from run to run.

# the true optimum is 9100.064279 (CEGIS), AR prunes it away: expect it once that AR bug is fixed
[[case]]
name = "ar-dpm-demo"
project = "dpm-demo"
args = ["--method", "ar"]
expected = "optimum: 9197.776289"

[[case]]
name = "ar-dpm-demo-requests"
project = "dpm-demo-jair24"
args = ["--props", "requests.props", "--method", "ar"]
expected = "optimum: 713.272961"

[[case]]
name = "ar-grid-easy"
project = "grid"
args = ["--props", "easy.props", "--method", "ar"]
expected = "feasible: no"

[[case]]
name = "ar-grid-jair24"
project = "grid-jair24"
args = ["--method", "ar"]
expected = "optimum: 0.926768"

[[case]]
name = "cegis-grid-easy"
project = "grid"
args = ["--props", "easy.props", "--method", "cegis"]
expected = "feasible: no"

[[case]]
name = "cegis-kydie"
project = "kydie"
args = ["--method", "cegis"]
expected = "optimum: 3.666667"

[[case]]
