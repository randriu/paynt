name: Lint
# Checks formatting (ruff format), lint findings (ruff check), docstring style (docformatter), and type
# hints (mypy) against paynt/ and tests/. The job fails if any check finds a problem, but all four always
# run regardless of each other's outcome (via if: success() || failure()) so every finding shows up in one
# run instead of being discovered one push at a time. Runs directly on a plain Python install (no
# stormpy/payntbind build needed) since all four tools operate on Python source alone; mypy's
# ignore_missing_imports config tolerates paynt's compiled/third-party dependencies not being installed.
#
# No standalone black step: ruff format replaces it as the project's formatter (dropped in favor of a
# single tool covering both lint and format).

on:
  push:
    branches:
      - master
  pull_request:
  # needed to trigger the workflow manually
  workflow_dispatch:

jobs:

  lint:
    name: ruff / docformatter / mypy
    runs-on: ubuntu-latest
    steps:
      - name: Git clone
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ruff==0.16.6 docformatter==1.7.8 mypy==2.3.1

      - name: Run ruff format --check
        run: ruff format --check --diff paynt/ tests/

      - name: Run ruff check
        if: success() || failure()
        run: ruff check paynt/ tests/

      - name: Run docformatter --check
        if: success() || failure()
        run: docformatter --check --diff -r paynt/ tests/

      - name: Run mypy
        if: success() || failure()
        run: mypy paynt/
