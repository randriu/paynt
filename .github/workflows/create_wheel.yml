name: Build wheels

on:
  schedule:
    # run weekly
    - cron: '0 10 * * 3'
  workflow_call:
  # needed to trigger the workflow manually
  workflow_dispatch:
    inputs:
      nightly:
        description: 'Build nightly/dev wheels (use stormpy nightly)'
        required: false
        default: true
        type: boolean

jobs:
  build_wheels:
    name: Build wheels for ${{ matrix.os }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      matrix:
        os: [ linux-intel, linux-arm, macos-intel, macos-arm ]
        include:
          # Set defaults
          - archs: auto
            platform: auto
            xcode: ""
            deploy_target: 13.0
          - os: linux-intel
            runs-on: ubuntu-latest
            archs: x86_64
          - os: linux-arm
            runs-on: ubuntu-24.04-arm
            archs: aarch64
          - os: macos-intel
            runs-on: macos-15-intel # x86_64 runner
            xcode: latest-stable
            deploy_target: 15.0
          - os: macos-arm
            runs-on: macos-15 # macos-15+ (including latest) are ARM64 runners
            xcode: latest-stable
            deploy_target: 15.0
      fail-fast: false
    steps:
      - name: Set NIGHTLY_BUILD flag
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ github.event.inputs.nightly }}" == true ]]; then
            echo "NIGHTLY_BUILD=true" >> $GITHUB_ENV
          else
            echo "NIGHTLY_BUILD=false" >> $GITHUB_ENV
          fi
      - uses: actions/checkout@v6
      - uses: maxim-lobanov/setup-xcode@v1
        if: ${{ matrix.xcode != '' }}
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Set STORMPY_ARTIFACT_NAME
        if: env.NIGHTLY_BUILD == 'true'
        run: |
          case "${{ matrix.os }}" in
            linux-intel)
              echo "STORMPY_ARTIFACT_NAME=stormpy-wheels-linux-intel" >> $GITHUB_ENV ;;
            linux-arm)
              echo "STORMPY_ARTIFACT_NAME=stormpy-wheels-linux-arm" >> $GITHUB_ENV ;;
            macos-intel)
              echo "STORMPY_ARTIFACT_NAME=stormpy-wheels-macos-intel" >> $GITHUB_ENV ;;
            macos-arm)
              echo "STORMPY_ARTIFACT_NAME=stormpy-wheels-macos-arm" >> $GITHUB_ENV ;;
            *)
              echo "Unknown matrix.os: ${{ matrix.os }}" >&2; exit 1 ;;
          esac
      - name: Download stormpy nightly wheel if NIGHTLY_BUILD
        if: env.NIGHTLY_BUILD == 'true'
        uses: dawidd6/action-download-artifact@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          workflow: create_wheel.yml
          repo: stormchecker/stormpy
          name: ${{ env.STORMPY_ARTIFACT_NAME }}
          path: stormpy_wheels/
      - name: Prepare nightly version
        if: env.NIGHTLY_BUILD == 'true'
        run: | 
          perl -i -pe 's/__version__ = "(\d+)\.(\d+)\.(\d+)"/"__version__ = \"$1.$2.".($3+1).".dev1\""/e' paynt/_version.py
          perl -i -pe 's/__version__ = "(\d+)\.(\d+)\.(\d+)"/"__version__ = \"$1.$2.".($3+1).".dev1\""/e' payntbind/lib/payntbind/_version.py
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.1
        if: env.NIGHTLY_BUILD == 'true'
        env:
          CIBW_PLATFORM: ${{ matrix.platform }}
          CIBW_ARCHS: ${{ matrix.archs }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deploy_target }}
          CIBW_ENVIRONMENT: NR_JOBS=4
          CIBW_ENVIRONMENT_LINUX: NR_JOBS=4 BOOST_ROOT=/opt/boost_1_83_0 BOOST_INCLUDEDIR=/opt/boost_1_83_0/include STORM_VERSION=master

          # Key: use pip as the build frontend, and pass --no-build-isolation
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"

          CIBW_BEFORE_BUILD: |
            python -m pip install -U pip

            PYTAG=$(python -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')")
            SOABI=$(python -c "import sysconfig; print(sysconfig.get_config_var('SOABI') or '')")

            WHEEL_DIR="$(pwd)/stormpy_wheels"
            echo "Looking for stormpy wheels in: $WHEEL_DIR"
            ls -la "$WHEEL_DIR" || true

            echo "PYTAG=$PYTAG"
            echo "SOABI=$SOABI"

            # Free-threaded builds have "t" in SOABI (e.g. cpython-314t-darwin)
            if [[ "$PYTAG" == "314" && "$SOABI" == *"314t"* ]]; then
              echo "Detected Python 3.14 free-threaded ($SOABI) -> installing cp314t stormpy"
              WHEEL=$(ls "$WHEEL_DIR"/*-cp314-cp314t-*.whl 2>/dev/null | head -n 1 || true)
            else
              echo "Detected non-free-threaded Python ($SOABI) -> installing cp${PYTAG} stormpy"
              WHEEL=$(ls "$WHEEL_DIR"/*-cp${PYTAG}-cp${PYTAG}-*.whl 2>/dev/null | head -n 1 || true)
            fi

            if [[ -z "${WHEEL:-}" ]]; then
              echo "No matching stormpy wheel found for PYTAG=$PYTAG SOABI=$SOABI" >&2
              echo "Available wheels:" >&2
              ls -la "$WHEEL_DIR" >&2 || true
              exit 1
            fi

            echo "Installing stormpy wheel: $WHEEL"
            python -m pip install --force-reinstall "$WHEEL"
            python -c "import stormpy; print('stormpy from:', stormpy.__file__)"
            python -m pip install scikit-build-core pybind11
      - name: Build wheels (non-nightly)
        uses: pypa/cibuildwheel@v3.4.1
        if: env.NIGHTLY_BUILD != 'true'
        env:
          CIBW_PLATFORM: ${{ matrix.platform }}
          CIBW_ARCHS: ${{ matrix.archs }}
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deploy_target }}
          CIBW_ENVIRONMENT: NR_JOBS=4
          CIBW_ENVIRONMENT_LINUX: NR_JOBS=4 BOOST_ROOT=/opt/boost_1_83_0 BOOST_INCLUDEDIR=/opt/boost_1_83_0/include STORM_VERSION=master
      - uses: actions/upload-artifact@v7
        with:
          name: paynt-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl


  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Set NIGHTLY_BUILD flag
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]] || [[ "${{ github.event.inputs.nightly }}" == true ]]; then
            echo "NIGHTLY_BUILD=true" >> $GITHUB_ENV
          else
            echo "NIGHTLY_BUILD=false" >> $GITHUB_ENV
          fi
      - uses: actions/checkout@v6
      - name: Prepare nightly version
        if: env.NIGHTLY_BUILD == 'true'
        run: | 
          perl -i -pe 's/__version__ = "(\d+)\.(\d+)\.(\d+)"/"__version__ = \"$1.$2.".($3+1).".dev1\""/e' paynt/_version.py
          perl -i -pe 's/__version__ = "(\d+)\.(\d+)\.(\d+)"/"__version__ = \"$1.$2.".($3+1).".dev1\""/e' payntbind/lib/payntbind/_version.py
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: paynt-sdist
          path: dist/*.tar.gz


  test_wheels_linux:
    name: Test wheel on ${{ matrix.distro }} and ${{ matrix.arch.name }}
    needs: [build_wheels]
    runs-on: ${{ matrix.arch.runner }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - {name: linux-intel,
             runner: ubuntu-latest
          }
          - {name: linux-arm,
             runner: ubuntu-24.04-arm
          }
        distro:
          - ubuntu:latest
          - ubuntu:rolling
          - debian:latest
          - fedora:latest
          - archlinux:latest
        exclude:
          - arch: {name: linux-arm, runner: ubuntu-24.04-arm}
            distro: archlinux:latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: paynt-wheels-${{ matrix.arch.name }}
          path: dist
          merge-multiple: true
      - name: Checkout test files
        uses: actions/checkout@v6
        with:
          path: dist/test_files
          sparse-checkout: |
            tests
      - name: Install from wheel and test
        # TODO run tests
        run: |
          docker run -i --rm -v ./dist:/wheel ${{ matrix.distro }} /bin/bash << 'EOF'
          set -euo pipefail
          set -x

          cd /wheel

          # Install Python & pip (varies per distro)
          if command -v apt; then
            apt update && DEBIAN_FRONTEND=noninteractive TZ=Etc/UTC apt install -y python3 python3-pip python3-venv python3-dev
          elif command -v dnf; then
            dnf install -y python3 python3-pip python3-devel
          elif command -v pacman; then
            pacman -Syu --noconfirm python python-pip
          fi

          # Get major+minor version (e.g. "311" for Python 3.11)
          PY_VER=$(python3 -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')")
          echo "Python version: $PY_VER"

          # Look for a matching wheel in the current directory
          WHEEL=$(ls paynt-*-cp${PY_VER}-*.whl 2>/dev/null | head -n1 || true)
          echo "Found wheel: $WHEEL"
          if [ -z "$WHEEL" ]; then
            echo "Error: No paynt wheel found for Python ${PY_VER:0:1}.${PY_VER:1}." >&2
            exit 1
          fi

          echo "Installing $WHEEL..."
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install "$WHEEL"

          # Run a basic import test (replace with pytest if needed)
          python3 -c "import paynt; import payntbind; print('Import successful')"
          EOF


  test_wheels_mac:
    name: Test wheel on ${{ matrix.distro.name }}
    needs: [build_wheels]
    runs-on: ${{ matrix.distro.distro }}
    strategy:
      fail-fast: false
      matrix:
        distro:
          - {name: "XCode Latest, ARM",
             os: macos-arm,
             distro: "macos-15",
             xcode: "latest-stable"
          }
          - {name: "XCode Latest, Intel",
             os: macos-intel,
             distro: "macos-15-intel",
             xcode: "latest-stable"
          }
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.distro.xcode }}
      - uses: actions/download-artifact@v8
        with:
          pattern: paynt-wheels-${{ matrix.distro.os }}
          path: dist
          merge-multiple: true
      - name: Install from wheel and test
        working-directory: dist
        run: |
          # Get major+minor version (e.g. "311" for Python 3.11)
          PY_VER=$(python3 -c "import sys; print(f'{sys.version_info.major}{sys.version_info.minor}')")
          echo "Python version: $PY_VER"
          # Look for a matching wheel in the current directory
          WHEEL=$(ls paynt-*-cp${PY_VER}-*.whl 2>/dev/null | head -n1 || true)
          echo "Found wheel: $WHEEL"
          if [ -z "$WHEEL" ]; then
            echo "Error: No paynt wheel found for Python ${PY_VER:0:1}.${PY_VER:1}." >&2
            exit 1
          fi
          echo "Installing $WHEEL..."
          python3 -m venv venv
          source venv/bin/activate
          python3 -m pip install "$WHEEL"
      - name: Checkout test files
        uses: actions/checkout@v6
        with:
          path: dist/test_files
          sparse-checkout: |
            tests
      - name: Test
        # TODO run tests
        working-directory: dist
        run: |
          source venv/bin/activate
          python3 -c "import paynt; import payntbind; print('Import successful')"